<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docente IA CampusLA</title>
  <style>
    /* Estilos Widget Docente IA CampusLA */
    #ia-teacher-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    #chat-trigger {
      background-color: #0056b3;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    #chat-trigger:hover {
      transform: scale(1.05);
    }

    #chat-window {
      width: 350px;
      height: 480px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: absolute;
      bottom: 60px;
      right: 0;
    }

    .chat-hidden {
      display: none !important;
    }

    .chat-header {
      background-color: #0056b3;
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      height: 9px;
      width: 9px;
      background-color: #28a745;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    #close-chat {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .chat-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .bot-message {
      background-color: #e9ecef;
      color: #212529;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .user-message {
      background-color: #0056b3;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-footer {
      display: flex;
      padding: 10px;
      border-top: 1px solid #dee2e6;
      background-color: #ffffff;
    }

    .chat-footer input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 20px;
      outline: none;
    }

    .chat-footer button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 14px;
      margin-left: 8px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Widget Flotante -->
  <div id="ia-teacher-widget">
    <div id="chat-window" class="chat-hidden">
      <div class="chat-header">
        <div class="teacher-info">
          <span class="status-dot"></span>
          <strong>Docente IA - Inglés B1</strong>
        </div>
        <button id="close-chat" onclick="toggleChat()">✕</button>
      </div>
      <div id="chat-body" class="chat-body">
        <div class="message bot-message">
          ¡Hola! 👋 Soy tu Docente IA de Inglés de CampusLA. Estoy entrenado con el método Super Intensivo B1. ¿En qué tema o módulo quieres trabajar hoy?
        </div>
      </div>
      <div class="chat-footer">
        <input type="text" id="user-input" placeholder="Escribe tu duda o respuesta..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>
    <button id="chat-trigger" onclick="toggleChat()">
      💬 Docente IA
    </button>
  </div>

  <script>
    const GEMINI_API_KEY = 'AIzaSyCd3AWzlfA1fgA1gK-LaXHJY3anXOecjrE'; 

    const SYSTEM_INSTRUCTION = "Eres el Docente IA oficial de Inglés de CampusLA. Tu método se basa estrictamente en el libro 'Programa Inglés B1 Super Intensivo' de Escuela Andina. REGLAS: Enseñas de forma secuencial (módulos 1 al 46). Corriges la gramática en inglés amablemente y mantienes un tono claro, motivador y directo.";

    function toggleChat() {
      const chatWindow = document.getElementById('chat-window');
      chatWindow.classList.toggle('chat-hidden');
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const messageText = input.value.trim();
      if (!messageText) return;

      appendMessage(messageText, 'user-message');
      input.value = '';

      const loadingId = appendMessage('Pensando...', 'bot-message');

      try {
        // Modelo con el alias universal compatible 'gemini-1.5-flash-latest'
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${GEMINI_API_KEY}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [
              {
                role: 'user',
                parts: [
                  { text: SYSTEM_INSTRUCTION + "\n\nPregunta del estudiante: " + messageText }
                ]
              }
            ]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          document.getElementById(loadingId).innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          document.getElementById(loadingId).innerText = 'Error API: ' + data.error.message;
        } else {
          document.getElementById(loadingId).innerText = 'Respuesta no recibida. Intenta nuevamente.';
        }

      } catch (error) {
        document.getElementById(loadingId).innerText = 'Error de conexión con la API.';
      }
    }

    function appendMessage(text, className) {
      const chatBody = document.getElementById('chat-body');
      const msgDiv = document.createElement('div');
      const id = 'msg-' + Date.now();
      msgDiv.id = id;
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      chatBody.appendChild(msgDiv);
      chatBody.scrollTop = chatBody.scrollHeight;
      return id;
    }
  </script>
</body>
</html>
