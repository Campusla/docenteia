<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLA - Companion IA</title>
    <!-- FontAwesome & Bootstrap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.2/css/bootstrap.min.css" />
    
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .chat-card {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #0d47a1;
            color: #ffffff;
            padding: 16px 20px;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg-user {
            align-self: flex-end;
            background-color: #0d47a1;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .msg-bot {
            align-self: flex-start;
            background-color: #e3f2fd;
            color: #0d47a1;
            border-bottom-left-radius: 2px;
        }

        .chat-footer {
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
        }

        .input-group textarea {
            resize: none;
            height: 45px;
            border-radius: 25px 0 0 25px !important;
            padding-top: 10px;
        }

        .btn-custom {
            background-color: #0d47a1;
            color: #ffffff;
            border-radius: 0 25px 25px 0 !important;
            padding-left: 20px;
            padding-right: 20px;
        }

        .btn-custom:hover {
            background-color: #1565c0;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="chat-header">
        <span>CampusLA - Tutor Inglish Pupies</span>
        <i class="fa-solid fa-robot"></i>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="message msg-bot">
            ¡Hola, bienvenido a CampusLA! Soy tu tutor interactivo de inglés. ¿Qué lección o tema vamos a practicar hoy?
        </div>
    </div>

    <div class="chat-footer">
        <form id="chatForm" onsubmit="handleSend(event)" class="d-flex align-items-center">
            <div class="input-group">
                <textarea id="userInput" class="form-control" placeholder="Escribe tu mensaje aquí..." onkeydown="checkEnter(event)"></textarea>
                <button type="submit" class="btn btn-custom">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function checkEnter(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            handleSend(event);
        }
    }

    async function handleSend(event) {
        if(event) event.preventDefault();
        
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        
        if (!text) return;

        addMessage(text, 'msg-user');
        input.value = '';

        const loadingDiv = addMessage("Pensando...", 'msg-bot');

        const systemPrompt = "Eres un tutor pedagógico de inglés cordial y experto de CampusLA (método Inglish Pupies). Responde en español de forma muy didáctica a la siguiente consulta: ";
        const fullPrompt = systemPrompt + text;

        try {
            // Petición a la API gratuita de DDG
            const statusResp = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://duckduckgo.com/duckchat/v1/status"), {
                headers: { "x-vqd-accept": "1" }
            });
            const vqd = statusResp.headers.get("x-vqd-4");

            const chatResp = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://duckduckgo.com/duckchat/v1/chat"), {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-vqd-4": vqd
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{ role: "user", content: fullPrompt }]
                })
            });

            const streamData = await chatResp.text();
            
            // Extraer el texto de la respuesta en streaming
            const lines = streamData.split("\n");
            let fullText = "";

            for (const line of lines) {
                if (line.startsWith("data: ")) {
                    const jsonStr = line.replace("data: ", "").trim();
                    if (jsonStr !== "[DONE]") {
                        try {
                            const parsed = JSON.parse(jsonStr);
                            if (parsed.message) {
                                fullText += parsed.message;
                            }
                        } catch(e){}
                    }
                }
            }

            if (fullText.trim().length > 0) {
                loadingDiv.innerText = fullText.trim();
            } else {
                loadingDiv.innerText = "No se obtuvo respuesta del tutor. Inténtalo de nuevo.";
            }

        } catch (error) {
            loadingDiv.innerText = "Error al conectar con la IA. Por favor reintenta.";
        }
    }

    function addMessage(text, className) {
        const body = document.getElementById('chatBody');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        body.appendChild(msgDiv);
        body.scrollTop = body.scrollHeight;
        return msgDiv;
    }
</script>

</body>
</html>
